<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="coaching-titre">
  <title id="coaching-titre">Coach tenant un porte-bloc qui guide une élève en squat avec kettlebell</title>
  <defs>
    <pattern id="coaching-trame" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="3" fill="#8b939c"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="#0b0b0d"/>
  <polygon points="0,0 380,0 0,330" fill="url(#coaching-trame)" opacity="0.25"/>
  <!-- Bandes diagonales derrière l'élève -->
  <polygon points="760,0 1080,0 900,800 580,800" fill="#ff5a1f"/>
  <polygon points="1120,0 1160,0 980,800 940,800" fill="#ff5a1f" opacity="0.5"/>
  <rect x="0" y="706" width="1200" height="94" fill="#16171a"/>
  <line x1="0" y1="706" x2="1200" y2="706" stroke="#8b939c" stroke-width="3" opacity="0.6"/>
  <!-- Trajectoire de guidage -->
  <path d="M590 300 C 660 200, 740 210, 790 270" fill="none" stroke="#f2f3f5" stroke-width="6" stroke-dasharray="4 16" stroke-linecap="round"/>
  <polygon points="800,286 772,276 796,256" fill="#f2f3f5"/>
  <!-- Coach -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#f2f3f5">
    <path d="M365 480 L352 590 L346 694 L306 698" stroke-width="44"/>
    <path d="M395 480 L412 590 L424 694 L464 698" stroke-width="44"/>
    <path d="M338 304 L422 304 L408 476 L352 476 Z" fill="#f2f3f5" stroke-width="22"/>
    <path d="M428 312 L500 326 L580 302" stroke-width="36"/>
    <path d="M334 312 L306 400 L360 410" stroke-width="36"/>
  </g>
  <rect x="352" y="476" width="56" height="18" fill="#8b939c"/>
  <circle cx="382" cy="236" r="42" fill="#f2f3f5"/>
  <!-- Casquette -->
  <path d="M340 230 A42 42 0 0 1 424 230 Z" fill="#ff5a1f"/>
  <rect x="404" y="222" width="46" height="10" rx="5" fill="#ff5a1f"/>
  <!-- Porte-bloc avec courbe de progression -->
  <g transform="rotate(-8 400 400)">
    <rect x="330" y="330" width="120" height="156" rx="8" fill="#ff5a1f"/>
    <rect x="344" y="350" width="92" height="122" rx="3" fill="#f2f3f5"/>
    <rect x="366" y="320" width="48" height="20" rx="4" fill="#8b939c"/>
    <g fill="#0b0b0d">
      <rect x="356" y="430" width="16" height="30"/>
      <rect x="380" y="410" width="16" height="50"/>
      <rect x="404" y="384" width="16" height="76"/>
    </g>
    <path d="M356 402 L384 384 L420 360" fill="none" stroke="#ff5a1f" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- Élève en squat avec kettlebell -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M800 548 L880 584 L866 694 L906 700" stroke-width="44" stroke="#8b939c"/>
    <path d="M800 548 L906 560 L900 694 L942 700" stroke-width="46" stroke="#f2f3f5"/>
    <path d="M800 548 L842 380" stroke-width="70" stroke="#f2f3f5"/>
    <path d="M852 392 L912 450 L928 420" stroke-width="34" stroke="#f2f3f5"/>
  </g>
  <circle cx="872" cy="316" r="42" fill="#f2f3f5"/>
  <!-- Queue de cheval -->
  <path d="M836 300 C 806 300, 792 330, 796 362 C 816 344, 826 330, 840 324 Z" fill="#f2f3f5"/>
  <!-- Kettlebell -->
  <path d="M922 404 C 922 362, 984 362, 984 404" fill="none" stroke="#8b939c" stroke-width="14"/>
  <circle cx="953" cy="440" r="44" fill="#16171a" stroke="#8b939c" stroke-width="6"/>
  <path d="M928 428 A28 28 0 0 1 958 414" fill="none" stroke="#f2f3f5" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <!-- Éclats d'effort -->
  <g stroke="#f2f3f5" stroke-width="6" stroke-linecap="round">
    <line x1="1010" y1="360" x2="1050" y2="340"/>
    <line x1="1020" y1="400" x2="1066" y2="396"/>
    <line x1="1010" y1="440" x2="1050" y2="456"/>
  </g>
</svg>

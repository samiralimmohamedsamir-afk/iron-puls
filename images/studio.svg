<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="studio-titre">
  <title id="studio-titre">Vue du plateau du studio : verrière d'atelier, racks, haltères et piste centrale</title>
  <defs>
    <linearGradient id="studio-verriere" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b939c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b939c" stop-opacity="0.12"/>
    </linearGradient>
